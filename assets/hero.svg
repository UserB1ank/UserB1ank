<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
  <title id="title">UserB1ank — Build. Explore. Repeat.</title>
  <desc id="desc">A neon developer terminal in copper and cyan, with an animated robot cat and orbiting signals.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#101a2b"/></linearGradient>
    <linearGradient id="edge"><stop stop-color="#ffae86"/><stop offset=".5" stop-color="#acb6f8"/><stop offset="1" stop-color="#63d8ea"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#28647e" stop-opacity=".45"/><stop offset="1" stop-color="#0b1020" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#aac5ee" stroke-opacity=".055"/></pattern>
    <style>
      text { font-family: 'Trebuchet MS', 'DejaVu Sans', sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
      .float { animation: float 5s cubic-bezier(.45,0,.3,1) infinite; }
      .pulse { animation: pulse 3s cubic-bezier(.45,0,.3,1) infinite; }
      .cursor { animation: cursor 1.6s steps(2,end) infinite; }
      .blink { transform-box: fill-box; transform-origin: center; animation: blink 7s cubic-bezier(.45,0,.3,1) infinite; }
      .signal { animation: signal 5s cubic-bezier(.45,0,.3,1) infinite; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes cursor { 0%,100% { opacity: 0; } 50% { opacity: 1; } }
      @keyframes blink { 0%,43%,47%,100% { transform: scaleY(1); } 45% { transform: scaleY(.08); } }
      @keyframes signal { 0% { transform: translateX(-120px); opacity: 0; } 20%,80% { opacity: 1; } 100% { transform: translateX(330px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .float,.pulse,.cursor,.blink,.signal { animation: none; } }
    </style>
  </defs>
  <rect x="1" y="1" width="998" height="388" rx="24" fill="#070b13" stroke="#25344b"/>
  <rect x="8" y="8" width="984" height="374" rx="18" fill="url(#surface)"/>
  <rect x="8" y="8" width="984" height="374" rx="18" fill="url(#grid)"/>
  <ellipse cx="800" cy="205" rx="250" ry="200" fill="url(#aura)"/>
  <path d="M27 1H973" stroke="url(#edge)" stroke-width="2"/>
  <circle cx="37" cy="34" r="5" fill="#ffae86"/><circle cx="56" cy="34" r="5" fill="#e9cd85"/><circle cx="75" cy="34" r="5" fill="#63d8ea"/>
  <text x="99" y="39" class="mono" fill="#899bb4" font-size="13">~/UserB1ank</text>
  <circle cx="838" cy="34" r="4" fill="#8bdfb2" class="pulse"/><text x="851" y="39" class="mono" fill="#9cabc0" font-size="12">curiosity: on</text>
  <path d="M28 57H972" stroke="#233047"/>
  <rect x="42" y="87" width="181" height="28" rx="14" fill="#19283a"/>
  <text x="57" y="105" class="mono" font-size="12" fill="#8ee0eb" letter-spacing="1.5">RUST + GO DEVELOPER</text>
  <text x="37" y="200" font-size="79" font-weight="700" letter-spacing="-4" fill="#eef2ff">UserB1ank<tspan fill="#ffae86">.</tspan></text>
  <text x="43" y="247" font-size="25" letter-spacing=".8" fill="#b2bfd7">Build. Explore. Repeat.</text>
  <text x="43" y="292" class="mono" font-size="15" fill="#7488a7">&gt; tools / security / terminal adventures</text>
  <rect x="458" y="278" width="9" height="17" rx="1" fill="#63d8ea" class="cursor"/>
  <path d="M43 331H610" stroke="#24364c"/>
  <path d="M43 331H110" stroke="#ffae86" stroke-width="2"/>
  <g class="signal"><path d="M154 331H204" stroke="#63d8ea" stroke-width="2"/></g>
  <text x="43" y="357" class="mono" font-size="11" fill="#8293ad" letter-spacing="2">PLAYER 01</text>
  <text x="610" y="357" class="mono" font-size="11" fill="#8293ad" text-anchor="end">ALWAYS A LITTLE CURIOUS</text>
  <g transform="translate(798 209)">
    <ellipse rx="127" ry="113" fill="none" stroke="#26415a" stroke-dasharray="3 9"/>
    <ellipse rx="147" ry="73" fill="none" stroke="#31455e" transform="rotate(-28)"/>
    <circle cx="-127" cy="0" r="5" fill="#ffae86" class="pulse"/>
    <circle cx="104" cy="-72" r="4" fill="#63d8ea"/>
    <ellipse cy="103" rx="67" ry="10" fill="#050b15" opacity=".5"/>
    <g class="float">
      <path d="M-60-27-65-78-20-51M60-27 65-78 20-51" fill="#263b53" stroke="#7d9bbb" stroke-width="2" stroke-linejoin="round"/>
      <path d="M-54-43-55-61-35-49M54-43 55-61 35-49" fill="#ffae86"/>
      <rect x="-76" y="-48" width="152" height="116" rx="34" fill="#142338" stroke="#80a5bd" stroke-width="2"/>
      <rect x="-65" y="-36" width="130" height="87" rx="26" fill="#090f1c" stroke="#263d52"/>
      <g class="blink" fill="#8ce7e9"><rect x="-42" y="-10" width="15" height="24" rx="7.5"/><rect x="27" y="-10" width="15" height="24" rx="7.5"/></g>
      <path d="M-13 22Q-7 34 0 24Q7 34 13 22" fill="none" stroke="#a6e7e2" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-50 20h11m-14 7h10M39 20h11m-7 7h10" stroke="#ffae86" stroke-width="2" stroke-linecap="round" opacity=".7"/>
      <rect x="-29" y="68" width="58" height="13" rx="6.5" fill="#243d54"/>
      <circle cy="74" r="3" fill="#ffae86" class="pulse"/>
    </g>
    <text x="0" y="145" class="mono" font-size="11" text-anchor="middle" fill="#7d9bbb" letter-spacing="2">SMALL CAT. BIG CURIOSITY.</text>
  </g>
</svg>
